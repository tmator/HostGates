[package]
edition = "2024"
rust-version = "1.94"
name = "ironrdp-mstsgu"
version = "0.1.0"
authors = [
    "Devolutions Inc. <infos@devolutions.net>",
    "Teleport <goteleport.com>",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Terminal Services Gateway Server Protocol"
homepage = "https://github.com/Devolutions/IronRDP"
readme = "README.md"
keywords = [
    "rdp",
    "remote-desktop",
    "network",
    "client",
    "protocol",
]
categories = ["network-programming"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Devolutions/IronRDP"
resolver = "2"

[features]
default = []
native-tls = [
    "ironrdp-tls/native-tls",
    "tokio-tungstenite/native-tls",
]
rustls = [
    "ironrdp-tls/rustls",
    "tokio-tungstenite/rustls-tls-native-roots",
]
smartcard = [
    "sspi/scard",
    "sspi/dns_resolver",
    "dep:picky",
    "dep:picky-asn1-der",
    "dep:picky-asn1-x509",
]
test-support = ["tokio/io-util"]

[lib]
name = "ironrdp_mstsgu"
path = "src/lib.rs"
test = false
doctest = false

[[test]]
name = "consent"
path = "tests/consent.rs"
required-features = [
    "native-tls",
    "test-support",
]

[[test]]
name = "http_auth"
path = "tests/http_auth.rs"
required-features = ["rustls"]

[[test]]
name = "http_control"
path = "tests/http_control.rs"

[[test]]
name = "packet_io"
path = "tests/packet_io.rs"
required-features = [
    "native-tls",
    "test-support",
]

[[test]]
name = "packet_io_rustls"
path = "tests/packet_io_rustls.rs"
required-features = [
    "rustls",
    "test-support",
]

[[test]]
name = "proxy"
path = "tests/proxy.rs"
required-features = [
    "native-tls",
    "test-support",
]

[[test]]
name = "rpc_pdu"
path = "tests/rpc_pdu.rs"

[[test]]
name = "rpc_tsgu_stubs"
path = "tests/rpc_tsgu_stubs.rs"

[[test]]
name = "rpch_client"
path = "tests/rpch_client.rs"

[[test]]
name = "rpch_http"
path = "tests/rpch_http.rs"

[[test]]
name = "rpch_session"
path = "tests/rpch_session.rs"

[[test]]
name = "rpch_v2"
path = "tests/rpch_v2.rs"

[[test]]
name = "tunnel_policy"
path = "tests/tunnel_policy.rs"

[[test]]
name = "udp"
path = "tests/udp.rs"

[dependencies.base64]
version = "0.22"

[dependencies.bitflags]
version = "2.11"

[dependencies.futures-util]
version = "0.3"

[dependencies.http-body-util]
version = "0.1.4"
features = ["channel"]

[dependencies.hyper]
version = "1.9"
features = [
    "client",
    "http1",
]

[dependencies.hyper-util]
version = "0.1"
features = ["tokio"]

[dependencies.ironrdp-core]
version = "0.3"
features = ["std"]

[dependencies.ironrdp-error]
version = "0.2"

[dependencies.ironrdp-tls]
version = "0.3.0"

[dependencies.log]
version = "0.4"

[dependencies.picky]
version = "=7.0.0-rc.25"
optional = true

[dependencies.picky-asn1-der]
version = "0.5"
optional = true

[dependencies.picky-asn1-x509]
version = "0.15"
optional = true

[dependencies.sspi]
version = "0.21"
features = ["network_client"]

[dependencies.tokio]
version = "1.52"
features = [
    "macros",
    "rt",
    "io-util",
]

[dependencies.tokio-socks]
version = "0.5.3"

[dependencies.tokio-tungstenite]
version = "0.29"

[dependencies.tokio-util]
version = "0.7"

[dependencies.uuid]
version = "1"
features = ["v4"]

[dev-dependencies.hyper]
version = "1.9"
features = [
    "server",
    "http1",
]

[dev-dependencies.tokio]
version = "1.52"
features = [
    "io-util",
    "macros",
    "net",
    "rt",
    "sync",
]

[dev-dependencies.tokio-native-tls]
version = "0.3"

